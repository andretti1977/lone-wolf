    <!-- viewport-fit=cover abilita le safe-area (notch / home indicator) su iPhone.
         NON usiamo user-scalable=no: lo zoom al focus si evita col font-size 16px sugli input. -->

      content="width=device-width, initial-scale=1.0, viewport-fit=cover"

    <!-- Splash screen native iOS (PWA installata): iOS mostra queste immagini
         durante il cold start, prima ancora del primo paint dell'HTML. Ogni tag
         deve combaciare ESATTAMENTE con device-width/height + pixel-ratio del
         device, altrimenti iOS lo ignora e mostra schermo vuoto. Generate da
         design/base_splash.png (cover-crop iPad, fit-width + pad navy iPhone). -->
    <link rel="apple-touch-startup-image" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/ios/apple-splash-1320-2868.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/ios/apple-splash-1206-2622.jpg" />

    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/ios/apple-splash-1170-2532.jpg" />

    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="/splash/ios/apple-splash-1242-2688.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="/splash/ios/apple-splash-828-1792.jpg" />

    <title>Kai-Chronik</title>
    <!-- Splash inline: si dipinge immediatamente col primo paint dell'HTML (prima
         che il bundle JS venga scaricato/eseguito), coprendo il gap di avvio anche
         da PWA installata su iOS. Rimosso da main.tsx quando l'app è montata.
         Mostra la stessa illustrazione delle splash native iOS (splash-web.jpg),
         così native → inline → app è una transizione senza salti di colore.
         Sfondo navy #0b0e18 = colore dei bordi di pad delle splash native →
         con background-size:contain i bordi combaciano. L'illustrazione contiene
         già il wordmark "LONE WOLF": niente testo/SVG aggiuntivo. -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #0b0e18;
        background-image: url("/splash/splash-web.jpg");
        background-repeat: no-repeat;
        background-position: center center;
        background-size: contain;
        transition: opacity 0.4s ease;
      }
      #splash.splash--hide {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Kai-Chronik"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
